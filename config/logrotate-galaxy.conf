# Rotates Galaxy's app-level logs written into ./logs (bind-mounted from
# /home/galaxy/logs inside the container). Docker's own json-file driver
# limits are already capped in compose.yaml (logging.options), but these
# supervisor-managed log files are written directly to disk inside the
# container and bypass that entirely — GALAXY_LOGGING=full grows them
# unbounded without this.
#
# Install on the HOST (not in the container):
#   sudo cp config/logrotate-galaxy.conf /etc/logrotate.d/galaxy
#   Edit the path below to the absolute path of this repo's ./logs first.
#
# Test without waiting for cron:
#   sudo logrotate -f /etc/logrotate.d/galaxy

/absolute/path/to/galaxy-docker-compose/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
