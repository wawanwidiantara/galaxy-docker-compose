# Single VM wears both roles — dbservers and galaxyservers point at the
# same host. Kept as two groups (matching the official tutorial's
# structure) rather than collapsed into one, because galaxyproject.postgresql
# and galaxyproject.galaxy are written to be applied to separate group
# targets — this also means the inventory needs near-zero changes the day
# you DO split Postgres onto its own host.

[dbservers]
galaxy-vm ansible_host=CHANGE_ME_VM_IP ansible_user=CHANGE_ME_SSH_USER

[galaxyservers]
galaxy-vm ansible_host=CHANGE_ME_VM_IP ansible_user=CHANGE_ME_SSH_USER

[galaxyservers:vars]
ansible_python_interpreter=/usr/bin/python3
